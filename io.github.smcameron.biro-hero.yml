id: io.github.smcameron.biro-hero
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: biro-hero.sh

finish-args:
  - --socket=x11
  - --socket=pulseaudio
  #- --share=ipc
  #- --device=dri
  #- --share=network

cleanup:
  - '/patches'

#sources:
 # - type: file
  #  path: applications/${FLATPAK_ID}.svg

modules:

  - name: portaudio
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: git
        url: https://github.com/PortAudio/portaudio.git
        tag: v19.7.0
        commit: 147dd722548358763a8b649b3e4b41dfffbcfbb6

  - name: biro-hero
    buildsystem: simple
    build-commands:
      - make
      - install -Dm0755 biro-hero ${FLATPAK_DEST}/bin/biro-hero
      - cp -r images ${FLATPAK_DEST}/bin/images
      - cp -r sounds ${FLATPAK_DEST}/bin/sounds
      - install -Dm0644 level-items.txt ${FLATPAK_DEST}/bin/level-items.txt
      - install -Dm755 biro-hero.sh ${FLATPAK_DEST}/bin/biro-hero.sh
      - install -Dm0644 io.github.smcameron.biro-hero.svg "${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.smcameron.biro-hero.svg"
      - install -Dm0644 io.github.smcameron.biro-hero.desktop "${FLATPAK_DEST}/share/applications/io.github.smcameron.biro-hero.desktop"
      - install -Dm0644 io.github.smcameron.biro-hero.xml "${FLATPAK_DEST}/share/metainfo/io.github.smcameron.biro-hero.xml"
    sources:
      - type: script
        dest-filename: biro-hero.sh
        commands:
          - cd /app/bin
          - exec ./biro-hero
        #dest: /app/bin
      - type: git
        url: https://github.com/smcameron/biro-hero.git
        commit: 63ba7f2151c43e842ca0099b83d3abfd15d171d1
      - type: patch
        path: patches/wwaviaudio_c.patch
      #- type: git
      - type: file
        path: applications/io.github.smcameron.biro-hero.svg
      - type: file
        path: applications/io.github.smcameron.biro-hero.desktop
      - type: file
        path: metainfo/io.github.smcameron.biro-hero.xml

